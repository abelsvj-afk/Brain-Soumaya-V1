<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FIXTURE — Great Station Mockup (Phase 1, throwaway)</title>
<style>
  html,body{margin:0;padding:0;background:#070a18;color:#dfe6ff;font-family:system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .banner{position:fixed;top:0;left:0;right:0;background:#7a2b12;color:#ffe9d6;text-align:center;
    font-size:12px;font-weight:700;letter-spacing:.08em;padding:5px 4px;z-index:10}
  #hud{position:fixed;left:8px;top:34px;background:rgba(8,10,24,.78);border:1px solid #39406e;border-radius:10px;
    padding:8px 10px;font-size:12px;line-height:1.5;z-index:9;min-width:196px}
  #hud b{color:#ffd9a0}
  #panel{position:fixed;left:8px;right:8px;bottom:8px;background:rgba(8,10,24,.82);border:1px solid #39406e;
    border-radius:12px;padding:8px;z-index:9;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  button{background:#232c52;color:#dfe6ff;border:1px solid #4a5590;border-radius:8px;padding:8px 10px;font-size:13px}
  button:active{background:#31407a}
  label{font-size:12px;display:flex;gap:5px;align-items:center}
  #measureOut{width:100%;font-size:11px;color:#a9ffce;white-space:pre-wrap;word-break:break-word}
</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
</head>
<body>
<div class="banner">FIXTURE — THROWAWAY MOCKUP · PHASE 1 · NOT THE PRODUCT</div>
<div id="app"></div>
<div id="hud">
  <div><b>Great Station</b> — approach mockup</div>
  <div>Seed: <span id="seedOut"></span></div>
  <div>Stage: <b id="stageOut">far</b></div>
  <div>FPS avg: <b id="fpsOut">—</b> · 1% low: <b id="lowOut">—</b></div>
  <div>Draw calls: <b id="callsOut">—</b> · Tris: <b id="trisOut">—</b></div>
  <div>Local time: <span id="clockOut">—</span></div>
</div>
<div id="panel">
  <button data-stage="far">Far</button>
  <button data-stage="mid">Handoff</button>
  <button data-stage="near">Near / Arrival</button>
  <button id="warpBtn">Warp Far→Near</button>
  <button id="driftBtn">Drift Far→Near</button>
  <button id="shotBtn">Capture still (D-13)</button>
  <button id="measureBtn">Run 60s measurement</button>
  <label><input type="checkbox" id="rmToggle"> Reduced motion</label>
  <div id="measureOut"></div>
</div>

<script type="module">
import * as THREE from 'three';

/* ============ Seed & palette (recipe §7 traceability) ============
   Seed string: "great-station / harbor-1". Every visual parameter below
   derives from this seed via mulberry32 — no hand-tweaked values (V4). */
const SEED_STRING = 'great-station / harbor-1';
function hashSeed(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(hashSeed(SEED_STRING));
const PAL = {
  structure: new THREE.Color().setHSL(0.62, 0.10, 0.16 + rng()*0.03),   // basalt graphite
  structureHi: new THREE.Color().setHSL(0.62, 0.08, 0.24),
  amber: new THREE.Color().setHSL(0.09 + rng()*0.02, 0.95, 0.60),       // sodium working light
  cyan: new THREE.Color(0x7fe7ff),                                      // navigation truth ONLY (fixed, not seeded)
  nebulaA: new THREE.Color().setHSL(0.66, 0.45, 0.10 + rng()*0.03),     // cold indigo
  nebulaB: new THREE.Color().setHSL(0.72, 0.40, 0.13 + rng()*0.03),
  fog: new THREE.Color().setHSL(0.66, 0.42, 0.08),
};
document.getElementById('seedOut').textContent = SEED_STRING;

/* ============ Renderer / scene / cameras (dual-layer compositing) ============ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();          // foreground layer
scene.fog = new THREE.FogExp2(PAL.fog, 0.0016);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 4000);

const bgScene = new THREE.Scene();        // backdrop layer (stars, nebula, sun, impostor)
const bgCamera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 4000);

/* ============ Backdrop: stars (seeded points), nebula planes, sun ============ */
function makeStars(count, rMin, rMax, size, color){
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const th = rng()*Math.PI*2, ph = Math.acos(2*rng()-1), r = rMin + rng()*(rMax-rMin);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph)*0.6;
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m = new THREE.PointsMaterial({size, color, sizeAttenuation:true, fog:false, transparent:true, opacity:0.9});
  return new THREE.Points(g, m);
}
bgScene.add(makeStars(2600, 900, 1600, 2.2, 0xcdd8ff));
scene.add(makeStars(500, 300, 700, 1.4, 0x9fb2ff)); // sparse near stars (foreground layer)

function glowTexture(inner, outer){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(128,128,8,128,128,128);
  gr.addColorStop(0, inner); gr.addColorStop(0.35, outer); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
// Nebula: large soft planes in the backdrop layer
for(let i=0;i<7;i++){
  const mat = new THREE.MeshBasicMaterial({map:glowTexture('rgba(70,84,180,0.55)','rgba(30,36,90,0.25)'),
    transparent:true, depthWrite:false, fog:false, color: i%2? PAL.nebulaA : PAL.nebulaB});
  const p = new THREE.Mesh(new THREE.PlaneGeometry(1500,1500), mat);
  p.position.set((rng()-0.5)*1600, (rng()-0.5)*700, -1200 - rng()*500);
  bgScene.add(p);
}
// The home sun — CURRENT size, unchanged (D-13: the mockup photographs the question).
const sun = new THREE.Mesh(new THREE.CircleGeometry(46, 48),
  new THREE.MeshBasicMaterial({map:glowTexture('rgba(255,244,214,1)','rgba(255,196,110,0.55)'), transparent:true, fog:false}));
sun.position.set(-330, 120, -1150);
bgScene.add(sun);

/* ============ The Station (foreground, crown-and-stem per settled recipe) ============ */
const station = new THREE.Group();
const matHull  = new THREE.MeshStandardMaterial({color:PAL.structure, roughness:0.85, metalness:0.35});
const matHullHi= new THREE.MeshStandardMaterial({color:PAL.structureHi, roughness:0.7, metalness:0.4});
const matAmber = new THREE.MeshBasicMaterial({color:PAL.amber});
const matCyan  = new THREE.MeshBasicMaterial({color:PAL.cyan});

// Spire (fixed proportions — recipe, never seed-randomized)
const spire = new THREE.Mesh(new THREE.CylinderGeometry(7, 13, 150, 10), matHull);
station.add(spire);
const spireTip = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 3.5, 42, 8), matHullHi);
spireTip.position.y = 96; station.add(spireTip);
const beacon = new THREE.Mesh(new THREE.SphereGeometry(2.2, 10, 10), matCyan); // nav truth
beacon.position.y = 119; station.add(beacon);

// Habitat ring (turns slowly; suppressed in reduced motion)
const ring = new THREE.Group();
const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(58, 6.5, 10, 40), matHull);
ringMesh.rotation.x = Math.PI/2; ring.add(ringMesh);
ring.position.y = 6;
station.add(ring);

// Four docking arms at the ring's quarters, each ending in cyan guidance lamps (nav truth)
const armTips = [];
for(let i=0;i<4;i++){
  const a = i*Math.PI/2;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(46, 4.5, 7), matHullHi);
  arm.position.set(Math.cos(a)*52, 6, Math.sin(a)*52);
  arm.rotation.y = -a; station.add(arm);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(1.8, 10, 10), matCyan);
  tip.position.set(Math.cos(a)*76, 6, Math.sin(a)*76);
  station.add(tip); armTips.push(tip.position.clone());
}

// Amber window lamps — instanced, seeded placement on spire + ring (working light, not nav)
function scatterLamps(){
  const geo = new THREE.SphereGeometry(0.85, 6, 6);
  const count = 420;
  const inst = new THREE.InstancedMesh(geo, matAmber, count);
  const d = new THREE.Object3D();
  for(let i=0;i<count;i++){
    if(i < 240){ // spire band
      const y = -68 + rng()*136, th = rng()*Math.PI*2, r = 13.5 - (y+75)*0.04;
      d.position.set(Math.cos(th)*r, y, Math.sin(th)*r);
    } else {     // ring band
      const th = rng()*Math.PI*2;
      d.position.set(Math.cos(th)*58, 6 + (rng()-0.5)*9, Math.sin(th)*58);
    }
    d.updateMatrix(); inst.setMatrixAt(i, d.matrix);
  }
  return inst;
}
station.add(scatterLamps());
scene.add(station);

// Backdrop impostor: dark silhouette of the same form, for the far stage (dual-layer handoff)
const impostor = new THREE.Group();
const matDark = new THREE.MeshBasicMaterial({color:0x0d1122, fog:false});
const impSpire = new THREE.Mesh(new THREE.CylinderGeometry(7, 13, 150, 8), matDark); impostor.add(impSpire);
const impRing = new THREE.Mesh(new THREE.TorusGeometry(58, 6.5, 8, 24), matDark);
impRing.rotation.x = Math.PI/2; impRing.position.y = 6; impostor.add(impRing);
const impGlow = new THREE.Points((()=>{const g=new THREE.BufferGeometry();const n=160;const p=new Float32Array(n*3);
  for(let i=0;i<n;i++){const th=rng()*Math.PI*2; if(i<80){p[i*3]=Math.cos(th)*58;p[i*3+1]=6+(rng()-0.5)*9;p[i*3+2]=Math.sin(th)*58;}
  else{const y=-68+rng()*136;p[i*3]=Math.cos(th)*12;p[i*3+1]=y;p[i*3+2]=Math.sin(th)*12;}}
  g.setAttribute('position', new THREE.BufferAttribute(p,3)); return g;})(),
  new THREE.PointsMaterial({size:2.6, color:PAL.amber, fog:false, transparent:true, opacity:0.95}));
impostor.add(impGlow);
impostor.position.set(0, 0, -1050); impostor.scale.setScalar(1.15);
bgScene.add(impostor);

// Gate ring behind the start point + cyan route line to the first arm (A19 route plotting)
const gate = new THREE.Mesh(new THREE.TorusGeometry(16, 1.1, 8, 36),
  new THREE.MeshStandardMaterial({color:PAL.structureHi, emissive:PAL.cyan, emissiveIntensity:0.55, roughness:0.5}));
gate.position.set(0, 0, 330); scene.add(gate);
const routePts = [new THREE.Vector3(0,0,330), new THREE.Vector3(30,4,140), armTips[1].clone().add(new THREE.Vector3(0,0,26))];
const route = new THREE.Line(new THREE.BufferGeometry().setFromPoints(routePts),
  new THREE.LineBasicMaterial({color:PAL.cyan, transparent:true, opacity:0.85}));
scene.add(route);

// Traffic (A17): instanced shuttles on seeded lanes near the arms — atmosphere, not fact
const TRAFFIC_N = 22;
const traffic = new THREE.InstancedMesh(new THREE.ConeGeometry(1.1, 4.6, 6),
  new THREE.MeshBasicMaterial({color:0xcfd8ff}), TRAFFIC_N);
scene.add(traffic);
const lanes = [];
for(let i=0;i<TRAFFIC_N;i++){
  const arm = armTips[i % 4];
  lanes.push({from: arm.clone().add(new THREE.Vector3((rng()-0.5)*30, (rng()-0.5)*22, 150 + rng()*120)),
              to:   arm.clone(), speed: 0.05 + rng()*0.10, off: rng()});
}

// The user's ship: small procedural craft that rides the arrival arc at the near stage
const ship = new THREE.Group();
const shipBody = new THREE.Mesh(new THREE.ConeGeometry(1.6, 6.5, 8),
  new THREE.MeshStandardMaterial({color:0xb9c4e8, roughness:0.4, metalness:0.6}));
shipBody.rotation.x = Math.PI/2; ship.add(shipBody);
const shipLamp = new THREE.Mesh(new THREE.SphereGeometry(0.55, 8, 8), matAmber);
shipLamp.position.set(0, 0, -3.4); ship.add(shipLamp);
scene.add(ship);

// Lights for the standard materials
scene.add(new THREE.AmbientLight(0x8890c0, 0.55));
const key = new THREE.DirectionalLight(0xffe2b8, 1.5); key.position.set(-200, 140, 120); scene.add(key);
const rim = new THREE.DirectionalLight(0x6f83ff, 0.7); rim.position.set(180, -60, -220); scene.add(rim);

/* ============ Camera stages & travel ============ */
const STAGES = {
  far:  {pos: new THREE.Vector3(150, 66, 470), look: new THREE.Vector3(0, 6, -1050), bg: 1.0},
  mid:  {pos: new THREE.Vector3(90, 40, 235),  look: new THREE.Vector3(0, 8, -260),  bg: 0.85},
  near: {pos: new THREE.Vector3(armTips[1].x + 26, 20, armTips[1].z + 44), look: new THREE.Vector3(0, 10, 0), bg: 0.55},
};
let currentStage = 'far';
let camAnim = null;
const reducedMotion = () => document.getElementById('rmToggle').checked;

function flyTo(stageName, mode){ // mode: 'cut' | 'warp' | 'drift'
  const s = STAGES[stageName];
  const dur = mode === 'warp' ? 2600 : mode === 'drift' ? 12000 : 1400;
  if(reducedMotion() || mode === 'cut'){
    camera.position.copy(s.pos); bgCamera.position.set(0,0,0);
    camAnim = null;
  } else {
    camAnim = {t:0, dur, from: camera.position.clone(), to: s.pos.clone(),
               fromLook: lastLook.clone(), toLook: s.look.clone(), mode};
  }
  currentStage = stageName;
  document.getElementById('stageOut').textContent = stageName + (mode ? ' ('+mode+')' : '');
  currentLook.copy(s.look);
}
let lastLook = new THREE.Vector3(0, 6, -1050);
let currentLook = lastLook.clone();
camera.position.copy(STAGES.far.pos);

/* ============ HUD: fps / draw calls / triangles / clock ============ */
const frameTimes = [];
let lastT = performance.now();
function hud(now){
  const dt = now - lastT; lastT = now;
  frameTimes.push(dt); if(frameTimes.length > 600) frameTimes.shift();
  const avg = frameTimes.reduce((a,b)=>a+b,0)/frameTimes.length;
  const sorted = [...frameTimes].sort((a,b)=>b-a);
  const low1 = sorted[Math.floor(sorted.length*0.01)] || avg;
  document.getElementById('fpsOut').textContent = (1000/avg).toFixed(1);
  document.getElementById('lowOut').textContent = (1000/low1).toFixed(1);
  const info = renderer.info.render;
  document.getElementById('callsOut').textContent = info.calls;
  document.getElementById('trisOut').textContent = info.triangles.toLocaleString('en-US');
  document.getElementById('clockOut').textContent =
    new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date()) + ' ET';
}

/* ============ Main loop ============ */
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  const rm = reducedMotion();

  if(camAnim){
    camAnim.t += 16.7;
    const k = Math.min(1, camAnim.t / camAnim.dur);
    const e = camAnim.mode === 'warp' ? (k<0.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2) : (1-Math.cos(Math.PI*k))/2;
    camera.position.lerpVectors(camAnim.from, camAnim.to, e);
    currentLook.lerpVectors(camAnim.fromLook, camAnim.toLook, e);
    if(k >= 1) camAnim = null;
  }
  camera.lookAt(currentLook);
  bgCamera.quaternion.copy(camera.quaternion);

  // Stage depth drives the dual-layer handoff: impostor fades as the real station takes over
  const dist = camera.position.length();
  const hand = THREE.MathUtils.clamp((dist - 130) / 260, 0, 1); // 1 = far (impostor), 0 = near (real)
  impostor.visible = hand > 0.02;
  impGlow.material.opacity = 0.95 * hand;
  station.visible = hand < 0.98;
  station.position.z = THREE.MathUtils.lerp(0, -1050, hand*0.92);
  sun.position.x = -330 + (1-hand)*60;

  if(!rm){
    ring.rotation.y = t * 0.05; // slow ring rotation (settled R-S4)
    const d = new THREE.Object3D();
    for(let i=0;i<TRAFFIC_N;i++){
      const L = lanes[i];
      const k = (t * L.speed + L.off) % 1;
      d.position.lerpVectors(L.from, L.to, k);
      d.lookAt(L.to); d.rotateX(Math.PI/2);
      d.updateMatrix(); traffic.setMatrixAt(i, d.matrix);
    }
    traffic.instanceMatrix.needsUpdate = true;
  }
  // Ship rides the arrival arc near the station; parked at the gate when far
  const arcK = 1 - hand;
  ship.position.set(
    THREE.MathUtils.lerp(6, armTips[1].x + 12, arcK),
    THREE.MathUtils.lerp(2, 14 + Math.sin(t*0.6)*1.2*(rm?0:1), arcK),
    THREE.MathUtils.lerp(318, armTips[1].z + 20, arcK));
  ship.lookAt(station.position.x, 8, station.position.z);

  renderer.clear();
  renderer.render(bgScene, bgCamera);
  renderer.clearDepth();
  renderer.render(scene, camera);
  hud(performance.now());
}
tick();

/* ============ Controls ============ */
document.querySelectorAll('[data-stage]').forEach(b =>
  b.addEventListener('click', () => flyTo(b.dataset.stage, 'cut')));
document.getElementById('warpBtn').addEventListener('click', () => { camera.position.copy(STAGES.far.pos); currentLook.copy(STAGES.far.look); flyTo('near', 'warp'); });
document.getElementById('driftBtn').addEventListener('click', () => { camera.position.copy(STAGES.far.pos); currentLook.copy(STAGES.far.look); flyTo('near', 'drift'); });
document.getElementById('shotBtn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'd13-station-' + currentStage + '.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
});

/* Measurement harness: samples frame times for 60s, reports vs §11.2 fields.
   NOTE: §11 grades the OWNER'S PHONE. Numbers from any other device are
   harness checks only and are labeled as such in the result record. */
let measuring = null;
document.getElementById('measureBtn').addEventListener('click', () => {
  const out = document.getElementById('measureOut');
  out.textContent = 'Measuring 60s — keep this tab in front, fly around…';
  const samples = [];
  let prev = performance.now();
  const t0 = prev;
  function sample(now){
    samples.push(now - prev); prev = now;
    if(now - t0 < 60000){ requestAnimationFrame(sample); return; }
    const sorted = [...samples].sort((a,b)=>a-b);
    const avg = samples.reduce((a,b)=>a+b,0)/samples.length;
    const low1ms = sorted[Math.floor(sorted.length*0.99)];
    const maxMs = sorted[sorted.length-1];
    const info = renderer.info.render;
    out.textContent =
      'MEASUREMENT (this device — NOT the §11 grading device)\n' +
      'frames: ' + samples.length +
      ' · fps avg: ' + (1000/avg).toFixed(1) +
      ' · 1% low fps: ' + (1000/low1ms).toFixed(1) +
      ' · longest frame: ' + maxMs.toFixed(1) + 'ms' +
      ' · draw calls: ' + info.calls +
      ' · triangles: ' + info.triangles +
      ' · devicePixelRatio: ' + renderer.getPixelRatio() +
      ' · viewport: ' + innerWidth + 'x' + innerHeight;
  }
  requestAnimationFrame(sample);
});

addEventListener('resize', () => {
  camera.aspect = bgCamera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix(); bgCamera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
