name: Fly Deploy

on:
  push:
    branches:
      - claude/soumaya-second-brain-v1-m4z4hc
  workflow_dispatch:

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build # web static build

  deploy:
    name: Deploy to Fly
    needs: test
    runs-on: ubuntu-latest
    # Avoid overlapping deploys (volume pins us to one machine).
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
