# fly.toml app configuration file generated for brain-soumaya-v1 on 2026-06-15T22:23:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'brain-soumaya-v1'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/brain.db'
  EMBED_CACHE_DIR = '/app/.model-cache'
  PORT = '8080'
  WEB_DIR = '/app/packages/web/dist'

[[mounts]]
  source = 'brain_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
